# This workflow will create a release when a tag is pushed

name: Create release

on:
  push:
    tags:
      - "netin-*.*.*"

jobs:
  release:
    name: Create release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the repository
        uses: actions/checkout@v5

      # Split version from version string
      # `netin-x.y.z` returns `x.y.z`
      - id: get-version
        run: |
          version=${GITHUB_REF_NAME#netin-}
          echo "version=$version" >> $GITHUB_OUTPUT
          # Check if version contains 'a' followed by digits at the end
          if echo "$version" | grep -q 'a[0-9]\+$'; then
            echo "is_prerelease=true" >> $GITHUB_OUTPUT
          else
            echo "is_prerelease=false" >> $GITHUB_OUTPUT
          fi

      - run: echo "Extracted version ${{steps.get-version.outputs.version}}"

      # Create a GitHub release draft
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          name: NetIn - ${{ steps.get-version.outputs.version }}
          prerelease: ${{ steps.get-version.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          make_latest: ${{ steps.get-version.outputs.is_prerelease == 'false' }}
